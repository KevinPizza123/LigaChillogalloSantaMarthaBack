{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto my-12 bg-white p-8 rounded-xl shadow-lg border border-gray-200">
    <div class="text-center mb-6">
        <span class="text-4xl">🔐</span>
        <h2 class="text-2xl font-bold text-gray-800 mt-2">Acceso a la Liga</h2>
    </div>
    <form action="{{ url_for('login') }}" method="POST" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
            <input type="text" name="username" required class="w-full px-3 py-2 border rounded-lg">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
            <input type="password" name="password" required class="w-full px-3 py-2 border rounded-lg">
        </div>
        <button type="submit" class="w-full bg-blue-800 hover:bg-blue-900 text-white font-bold py-2 rounded-lg">Ingresar</button>
    </form>
</div>
{% endblock %}
